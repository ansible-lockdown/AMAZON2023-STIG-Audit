---

{{ if .Vars.az2023stig_001020 }}
command:
  azlx_23_001020_check:
    title: AZLX-23-001020 | MEDIUM | Amazon Linux 2023 must require users to provide a password for privilege escalation.
    exec: grep -R NOPASSWD /etc/sudoers /etc/sudoers.d/* | grep -v '.*:#'
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/^.*/'
    meta:
      Cat: 2
      Rule_ID: SV-274016r1120036_rule
      STIG_ID: AZLX-23-001020
      Vul_ID: V-274016
      Group_Title: SRG-OS-000480-GPOS-00227
      CCI: CCI-000366
      NIST800-53R4: CM-6
{{ end }}
