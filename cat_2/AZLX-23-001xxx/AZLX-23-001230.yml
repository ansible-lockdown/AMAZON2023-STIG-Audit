{{ if .Vars.az2023stig_001230 }}
command:
  azlx_23_001230_config:
    title: AZLX-23-001230 | MEDIUM | Amazon Linux 2023 SSHD must accept public key authentication.
    exec: grep -i PubkeyAuthentication /etc/ssh/sshd_config /etc/ssh/sshd_config.d/*.conf
    exit-status: 0
    stdout:
    - '/.*:PubkeyAuthentication yes/'
    - '!/(?i)^PubkeyAuthentication no/'
