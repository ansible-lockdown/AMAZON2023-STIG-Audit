    title: AZLX-23-002075 | MEDIUM | Amazon Linux 2023 must encrypt, via the OpenSSL TLS (ossl) driver, the transfer of audit records off-loaded onto a different system or media from the system being audited by rsyslog.
    exec: grep -rE 'StreamDriver\s*=\s*"ossl"|\$DefaultNetstreamDriver\s+ossl' /etc/rsyslog.conf /etc/rsyslog.d/
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/StreamDriver\s*=\s*"ossl"|DefaultNetstreamDriver\s+ossl/'
    meta:
      Cat: 2
      Rule_ID: SV-274079r1210985_rule
      STIG_ID: AZLX-23-002075
      Vul_ID: V-274079
      Group_Title: SRG-OS-000479-GPOS-00224
      CCI: CCI-001851
      NIST800-53R4: AU-4
