{{ if .Vars.az2023stig_002140 }}
command:
  azlx_23_002140_audit_rules_live:
    title: AZLX-23-002140 | MEDIUM | Amazon Linux 2023 must audit all uses of the create_module system call.
    exec: auditctl -l | grep create_module
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/-a always,exit -F arch=b64 -S create_module -F auid>=1000 -F auid!=-1 -F key=module-change/'
    meta:
      Cat: 2
      Rule_ID: SV-274092r1120264_rule
      STIG_ID: AZLX-23-002140
      Vul_ID: V-274092
