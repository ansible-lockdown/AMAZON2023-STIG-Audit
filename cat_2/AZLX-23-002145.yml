{{ if .Vars.az2023stig_002145 }}
command:
  azlx_23_002145_audit_rules_live:
    title: AZLX-23-002145 | MEDIUM | Amazon Linux 2023 must audit all uses of the kmod command.
    exec: auditctl -l | grep kmod
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^-a always,exit -S all -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=-1 -F key=modules/'
    meta:
      Cat: 2
      Rule_ID: SV-274093r1120267_rule
      STIG_ID: AZLX-23-002145
      Vul_ID: V-274093
      Group_Title:
      - SRG-OS-000037-GPOS-00015
