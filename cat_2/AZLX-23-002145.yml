      - CCI-002884
      NIST800-53R4:
      - AU-3
      - AU-12
      - MA-4
  azlx_23_002145_audit_rules_conf:
    title: AZLX-23-002145 | MEDIUM | Amazon Linux 2023 must audit all uses of the kmod command.
    exec: grep -w kmod /etc/audit/rules.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*:-a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -k modules/'
    meta:
      Cat: 2
      Rule_ID: SV-274093r1120267_rule
