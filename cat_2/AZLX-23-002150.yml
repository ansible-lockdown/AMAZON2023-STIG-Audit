---

{{ if .Vars.az2023stig_002150 }}
command:
  azlx_23_002150_audit_rules_live:
    title: AZLX-23-002150 | MEDIUM | Amazon Linux 2023 must audit all uses of the rename, unlink, rmdir, renameat, and unlinkat system calls.
    exec: auditctl -l | grep rename
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^-a always,exit -F arch=b64 -S rename,rmdir,unlink,unlinkat,renameat -F auid>=1000 -F auid!=-1 -F key=delete/'
    meta:
      Cat: 2
      Rule_ID: SV-274094r1120270_rule
      STIG_ID: AZLX-23-002150
      Vul_ID: V-274094
      Group_Title:
      - SRG-OS-000037-GPOS-00015
