---

{{ if .Vars.az2023stig_002165 }}
command:
  azlx_23_002165_audit_rules_live:
    title: AZLX-23-002165 | MEDIUM | Amazon Linux 2023 must generate audit records for all account creations, modifications, disabling, and termination events that affect /var/log/lastlog.
    exec: auditctl -l | grep lastlog
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^-w /var/log/lastlog -p wa -k logins/'
    meta:
      Cat: 2
      Rule_ID: SV-274097r1120279_rule
      STIG_ID: AZLX-23-002165
      Vul_ID: V-274097
      Group_Title:
      - SRG-OS-000037-GPOS-00015
