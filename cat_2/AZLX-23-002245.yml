---

{{ if .Vars.az2023stig_002245 }}

command:
  azlx_23_002245_audit_rules_live:
    title: AZLX-23-002245 | MEDIUM | Amazon Linux 2023 must audit all uses of the sudo command.
    exec: auditctl -l | grep sudo
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^-a always,exit -S all -F path=/usr/bin/sudo -F perm=x -F auid>=1000 -F auid!=-1 -F key=priv_cmd/'
    meta:
      Cat: 2
      Rule_ID: SV-274112r1120324_rule
      STIG_ID: AZLX-23-002245
      Vul_ID: V-274112
      Group_Title:
      - SRG-OS-000037-GPOS-00015
      - SRG-OS-000042-GPOS-00020
      - SRG-OS-000062-GPOS-00031
      - SRG-OS-000392-GPOS-00172
      - SRG-OS-000462-GPOS-00206
      - SRG-OS-000471-GPOS-00215
      CCI:
      - CCI-000130
      - CCI-000135
      - CCI-000169
      - CCI-002884
      - CCI-000172
      NIST800-53R4:
      - AU-3
      - AU-12
      - MA-4
  azlx_23_002245_audit_rules_conf:
    title: AZLX-23-002245 | MEDIUM | Amazon Linux 2023 must audit all uses of the sudo command.
    exec: grep -w sudo /etc/audit/rules.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*:-a always,exit -F path=/usr/bin/sudo -F perm=x -F auid>=1000 -F auid!=unset -k priv_cmd/'
    meta:
      Cat: 2
      Rule_ID: SV-274112r1120324_rule
      STIG_ID: AZLX-23-002245
      Vul_ID: V-274112
      Group_Title:
      - SRG-OS-000037-GPOS-00015
      - SRG-OS-000042-GPOS-00020
      - SRG-OS-000062-GPOS-00031
      - SRG-OS-000392-GPOS-00172
      - SRG-OS-000462-GPOS-00206
      - SRG-OS-000471-GPOS-00215
      CCI:
      - CCI-000130
      - CCI-000135
      - CCI-000169
      - CCI-002884
      - CCI-000172
      NIST800-53R4:
      - AU-3
      - AU-12
      - MA-4
{{ end }}
