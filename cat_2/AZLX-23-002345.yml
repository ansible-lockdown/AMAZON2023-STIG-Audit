{{ if .Vars.az2023stig_002345 }}
command:
  system_commands_owner:
    title: AZLX-23-002345 | MEDIUM | Amazon Linux 2023 system commands must be owned by root.
    exec: find -L /bin /sbin /usr/bin /usr/sbin /usr/libexec /usr/local/bin /usr/local/sbin ! -user root -exec ls {} \;
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.*/'
    meta:
      Cat: 2
      Rule_ID: SV-274131r1120381_rule
      STIG_ID: AZLX-23-002345
      Vul_ID: V-274131
      Group_Title: SRG-OS-000259-GPOS-00100
      CCI: CCI-001499
      NIST800-53R4: CM-5
{{ end }}
