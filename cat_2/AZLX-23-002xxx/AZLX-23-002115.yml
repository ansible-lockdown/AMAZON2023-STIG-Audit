      - SRG-OS-000062-GPOS-00031
      - SRG-OS-000392-GPOS-00172
      - SRG-OS-000462-GPOS-00206
      - SRG-OS-000471-GPOS-00215
      - SRG-OS-000064-GPOS-00033
      - SRG-OS-000466-GPOS-00210
      - SRG-OS-000458-GPOS-00203
      CCI:
      - CCI-000130
      - CCI-000135
      - CCI-000169
      - CCI-000172
      - CCI-002884
      NIST800-53R4:
      - AU-3
      - AU-12
      - MA-4
  azlx_23_002115_audit_rules_conf:
    title: AZLX-23-002115 | MEDIUM | Amazon Linux 2023 must audit all uses of the chmod, fchmod, and fchmodat system calls.
    exec: grep -w chmod /etc/audit/rules.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*:-a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -k perm_mod/'
    meta:
      Cat: 2
      Rule_ID: SV-274087r1120249_rule
      STIG_ID: AZLX-23-002115
      Vul_ID: V-274087
