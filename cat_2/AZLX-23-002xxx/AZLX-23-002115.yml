---

{{ if .Vars.az2023stig_002115 }}
command:
  azlx_23_002115_audit_rules_live:
    title: AZLX-23-002115 | MEDIUM | Amazon Linux 2023 must audit all uses of the chmod, fchmod, and fchmodat system calls.
    exec: auditctl -l | grep chmod
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/-a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=-1 -F key=perm_mod/'
    meta:
      Cat: 2
      Rule_ID: SV-274087r1120249_rule
      STIG_ID: AZLX-23-002115
      Vul_ID: V-274087
      Group_Title:
      - SRG-OS-000037-GPOS-00015
