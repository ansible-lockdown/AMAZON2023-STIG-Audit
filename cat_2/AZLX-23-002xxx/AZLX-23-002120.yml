---

{{ if .Vars.az2023stig_002120 }}
command:
  azlx_23_002120_audit_rules_live:
    title: AZLX-23-002120 | MEDIUM | Amazon Linux 2023 must audit all uses of the chown, fchown, fchownat, and lchown system calls
    exec: auditctl -l | grep chown
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/-a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -F auid>=1000 -F auid!=-1 -F key=perm_mod/'
    meta:
      Cat: 2
      Rule_ID: SV-274088r1120252_rule
      STIG_ID: AZLX-23-002120
      Vul_ID: V-274088
      Group_Title:
      - SRG-OS-000037-GPOS-00015
