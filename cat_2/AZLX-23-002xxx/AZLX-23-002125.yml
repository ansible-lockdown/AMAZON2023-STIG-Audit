---

{{ if .Vars.az2023stig_002125 }}
command:
  azlx_23_002125_audit_rules_live:
    title: AZLX-23-002125 | MEDIUM | Amazon Linux 2023 must audit all uses of the setxattr, fsetxattr, lsetxattr, removexattr, fremovexattr, and lremovexattr system calls.
    exec: auditctl -l | grep setxattr
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^-a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=-1 -F key=perm_mod/'
    - '/^-a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid=0 -F key=perm_mod/'
    meta:
      Cat: 2
      Rule_ID: SV-274089r1120255_rule
      STIG_ID: AZLX-23-002125
      Vul_ID: V-274089
      Group_Title:
      - SRG-OS-000037-GPOS-00015
      - SRG-OS-000042-GPOS-00020
      - SRG-OS-000062-GPOS-00031
      - SRG-OS-000392-GPOS-00172
      - SRG-OS-000458-GPOS-00203
      - SRG-OS-000462-GPOS-00206
      - SRG-OS-000471-GPOS-00216
      - SRG-OS-000474-GPOS-00220
      - SRG-OS-000064-GPOS-00033
      - SRG-OS-000466-GPOS-00210
      CCI:
      - CCI-000130
      - CCI-000135
      - CCI-000169
      - CCI-000172
      - CCI-002884
      NIST800-53R4:
      - AU-3
      - AU-12
      - MA-4
  azlx_23_002125_audit_rules_conf:
    title: AZLX-23-002125 | MEDIUM | Amazon Linux 2023 must audit all uses of the setxattr, fsetxattr, lsetxattr, removexattr, fremovexattr, and lremovexattr system calls.
    exec: grep -w setxattr /etc/audit/rules.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*:-a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid>=1000 -F auid!=unset -k perm_mod/'
    - '/^.*:-a always,exit -F arch=b64 -S setxattr,fsetxattr,lsetxattr,removexattr,fremovexattr,lremovexattr -F auid=0 -k perm_mod/'
    meta:
      Cat: 2
      Rule_ID: SV-274089r1120255_rule
      STIG_ID: AZLX-23-002125
      Vul_ID: V-274089
      Group_Title:
      - SRG-OS-000037-GPOS-00015
      - SRG-OS-000042-GPOS-00020
      - SRG-OS-000062-GPOS-00031
      - SRG-OS-000392-GPOS-00172
      - SRG-OS-000458-GPOS-00203
      - SRG-OS-000462-GPOS-00206
      - SRG-OS-000471-GPOS-00216
      - SRG-OS-000474-GPOS-00220
      - SRG-OS-000064-GPOS-00033
      - SRG-OS-000466-GPOS-00210
      CCI:
      - CCI-000130
      - CCI-000135
      - CCI-000169
      - CCI-000172
      - CCI-002884
      NIST800-53R4:
      - AU-3
      - AU-12
      - MA-4
{{ end }}
