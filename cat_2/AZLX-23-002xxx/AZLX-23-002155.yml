command:
  azlx_23_002155_audit_rules_live:
    title: AZLX-23-002155 | MEDIUM | Amazon Linux 2023 must audit all uses of the chcon command.
    exec: auditctl -l | grep chcon
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^-a always,exit -S all -F path=/usr/bin/chcon -F perm=x -F auid>=1000 -F auid!=-1 -F key=perm_mod/'
    meta:
      Cat: 2
      Rule_ID: SV-274095r1120273_rule
