      - MA-4
  azlx_23_002210_audit_rules_conf:
    title: AZLX-23-002210 | MEDIUM | Amazon Linux 2023 must audit all successful/unsuccessful uses of the chage command.
    exec: grep -w chage /etc/audit/rules.d/*
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^.*:-a always,exit -F path=/usr/bin/chage -F perm=x -F auid>=1000 -F auid!=unset -k privileged-chage/'
    meta:
      Cat: 2
      Rule_ID: SV-274105r1120661_rule
