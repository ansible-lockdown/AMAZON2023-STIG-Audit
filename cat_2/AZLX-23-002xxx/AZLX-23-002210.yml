{{ if .Vars.az2023stig_002210 }}
command:
  azlx_23_002210_audit_rules_live:
    title: AZLX-23-002210 | MEDIUM | Amazon Linux 2023 must audit all successful/unsuccessful uses of the chage command.
    exec: auditctl -l | grep chage
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^-a always,exit -S all -F path=/usr/bin/chage -F perm=x -F auid>=1000 -F auid!=-1 -F key=privileged-chage/'
    meta:
      Cat: 2
      Rule_ID: SV-274105r1120661_rule
      STIG_ID: AZLX-23-002210
      Vul_ID: V-274105
      Group_Title:
      - SRG-OS-000037-GPOS-00015
