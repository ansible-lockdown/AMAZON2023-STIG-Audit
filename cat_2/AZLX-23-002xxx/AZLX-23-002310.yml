{{ if .Vars.az2023stig_002310 }}
command:
  library_dirs_group_owner:
    title: AZLX-23-002310 | MEDIUM | Amazon Linux 2023 library directories must be group-owned by root or a system account.
    exec: find /lib /lib64 /usr/lib /usr/lib64 ! -group root -type d
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '!/.*/'
    meta:
      Cat: 2
      Rule_ID: SV-274125r1120363_rule
      STIG_ID: AZLX-23-002310
      Vul_ID: V-274125
      Group_Title: SRG-OS-000259-GPOS-00100
      CCI: CCI-001499
      NIST800-53R4: CM-5
{{ end }}
