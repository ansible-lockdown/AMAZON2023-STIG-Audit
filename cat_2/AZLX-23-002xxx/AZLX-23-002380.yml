---

{{ if .Vars.az2023stig_002380 }}
command:
  azlx_23_002380_config_ocredit:
    title: AZLX-23-002380 | MEDIUM | Amazon Linux 2023 must enforce password complexity by requiring that at least one special character be used.
    exec: grep ocredit /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/.*\:ocredit\s*=\s*-\d/'
    - '!/.*\:ocredit\s*=\s*\d/'
    meta:
      Cat: 2
      Rule_ID: SV-274138r1120402_rule
      STIG_ID: AZLX-23-002380
      Vul_ID: V-274138
      Group_Title:
      - SRG-OS-000266-GPOS-00101
      - SRG-OS-000725-GPOS-00180
      CCI: NA
      NIST800-53R4: NA
{{ end }}
