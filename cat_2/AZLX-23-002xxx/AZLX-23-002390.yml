---

{{ if .Vars.az2023stig_002390 }}
command:
  azlx_23_002390_config_dictcheck:
    title: AZLX-23-002390 | MEDIUM | Amazon Linux 2023 must prevent the use of dictionary words for passwords.
    exec: grep dictcheck /etc/security/pwquality.conf /etc/security/pwquality.conf.d/*.conf
    exit-status:
      or:
      - 0
      - 2
    stdout:
    - '/.*\:dictcheck\s*=\s*1/'
    - '!/.*\:dictcheck\s*=\s*0/'
    meta:
      Cat: 2
      Rule_ID: SV-274140r1120408_rule
      STIG_ID: AZLX-23-002390
      Vul_ID: V-274140
      Group_Title:
      - SRG-OS-000480-GPOS-00225
      - SRG-OS-000710-GPOS-00160
      CCI: CCI-000366
      NIST800-53R4: CM-6
{{ end }}
