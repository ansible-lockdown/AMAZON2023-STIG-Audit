---

{{ if .Vars.az2023stig_002420 }}
command:
  azlx_23_002420_initial_authentication_check:
    title: AZLX-23-002420 | MEDIUM | Amazon Linux 2023 must automatically lock an account when three unsuccessful logon attempts occur.
    exec: grep pam_faillock.so /etc/pam.d/password-auth
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - '/^auth\s+required\s+pam_faillock.so preauth dir=/var/log/faillock silent audit deny=3 even_deny_root fail_interval=900 unlock_time=0/'
    - '/^account\s+required\s+pam_faillock.so/'
    - '/^auth\s+required\s+pam_faillock.so authfail dir=/var/log/faillock unlock_time=0/'
    meta:
      Cat: 2
      Rule_ID: SV-274147r1120429_rule
      STIG_ID: AZLX-23-002420
      Vul_ID: V-274147
      Group_Title: SRG-OS-000021-GPOS-00005
      CCI: CCI-000044
      NIST800-53R4: AC-7
{{ end }}
