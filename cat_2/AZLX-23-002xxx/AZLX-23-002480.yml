      STIG_ID: AZLX-23-002480
      Vul_ID: V-274159
      Group_Title:
      - SRG-OS-000042-GPOS-00020
      - SRG-OS-000104-GPOS-00051
      - SRG-OS-000121-GPOS-00062
      CCI:
      - CCI-000764
      - CCI-000804
      - CCI-000135
