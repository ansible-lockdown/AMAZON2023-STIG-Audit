---

{{ if .Vars.az2023stig_002540 }}
command:
  azlx_23_002540_check_protected_symlinks:
    title: AZLX-23-002540 | MEDIUM | Amazon Linux 2023 must enable discretionary access control on symlinks.
    exec: sysctl fs.protected_symlinks
    exit-status:
      or:
      - 0
      - 1
    stdout:
    - 'fs.protected_symlinks = 1'
    - '!/fs.protected_symlinks = 0/'
    meta:
      Cat: 2
      Rule_ID: SV-274170r1120498_rule
      STIG_ID: AZLX-23-002540
      Vul_ID: V-274170
      Group_Title:
      - SRG-OS-000324-GPOS-00125
      - SRG-OS-000312-GPOS-00123
      CCI:
      - CCI-002165
      - CCI-002235
      NIST800-53R4:
      - AC-3
      - AC-6
kernel-param:
  fs.protected_symlinks:
    title: AZLX-23-002540 | MEDIUM | Amazon Linux 2023 must enable discretionary access control on symlinks.
    value: '1'
    meta:
      Cat: 2
      Rule_ID: SV-274170r1120498_rule
      STIG_ID: AZLX-23-002540
