  azlx_23_002625_check_pam_faillock_password_auth:
    title: AZLX-23-002625 | MEDIUM | Amazon Linux 2023 must configure the use of the pam_faillock.so module in the /etc/pam.d/password-auth file.
    path: /etc/pam.d/password-auth
    exists: true
    contents:
    - '/^auth\s+required\s+pam_faillock.so preauth/'
    - '/^auth\s+required\s+pam_faillock.so authfail/'
    - '/^account\s+required\s+pam_faillock.so/'
