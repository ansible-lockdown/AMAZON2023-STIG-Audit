---

{{ if .Vars.az2023stig_002630 }}
command:
  azlx_23_002630_check_faillock_conf:
    title: AZLX-23-002630 | MEDIUM | Amazon Linux 2023 must configure the use of the pam_faillock.so module in the /etc/security/faillock.conf file.
    exec: grep -E "^(deny|fail_interval|unlock_time)" /etc/security/faillock.conf
    exit-status: 0
    stdout:
    - '/^deny\s*=\s*[0-5]$/'
    - '/^fail_interval\s*=\s*/'
    - '/^unlock_time\s*=\s*/'
    meta:
      Cat: 2
      Rule_ID: SV-274188r1120552_rule
      STIG_ID: AZLX-23-002630
      Vul_ID: V-274188
      Group_Title: SRG-OS-000021-GPOS-00005
      CCI: CCI-000044
      NIST800-53R4: AC-7
{{ end }}
