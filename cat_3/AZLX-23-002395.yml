---

{{ if .Vars.az2023stig_002395 }}
command:
  azlx_23_002395_maxlogins_security:
    title: AZLX-23-002395 | LOW | Amazon Linux 2023 must limit the number of concurrent sessions to ten for all accounts and/or account types.
    exec: grep -r -s '^[^#].*maxlogins' /etc/security/limits.conf /etc/security/limits.d/*.conf
    exit-status:
      or:
      - 0
      - 1
      - 2
    stdout:
    - '/.*:\* hard maxlogins (10|[1-9])/'
    meta:
      Cat: 3
      Rule_ID: SV-274141r1120411_rule
      STIG_ID: AZLX-23-002395
      Vul_ID: V-274141
      Group_Title: SRG-OS-000027-GPOS-00008
      CCI: CCI-000054
      NIST800-53R4: AC-10
{{ end }}
