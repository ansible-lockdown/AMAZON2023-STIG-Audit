# Variables

# The following variable represents a setting for periodical checking of the filesystem's
# integrity using AIDE. It provides a parameter required to configure the cron job on
# the target system. Cron is a time-based job scheduling program in Unix OS, which
# allows tasks to be scheduled and executed automatically at a certain point in time.
# This variable represents the path to the AIDE crontab file.
az2023stig_aide_cron_file: /etc/cron.d/aide


az2023stig_syslog_trustedcertificatefile: /etc/ssl/ca/trusted.pem
az2023stig_syslog_servercertificatefile: /etc/ssl/certs/syslog.pem
az2023stig_syslog_serverkeyfile: /etc/ssl/private/syslog.pem
az2023stig_syslog_remote_log_server: syslog+tcp://127.0.0.1:514

az2023stig_dod_ciphers:  aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr

az2023stig_dod_macs: hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512


az2023stig_selinux_policy: targeted

az2023stig_maxlogins: 10

az2023stig_logon_banner:
